name: BTC risk monitor validated source bridge
on:
  workflow_dispatch:
  push:
    paths:
      - "btc-monitor/build_feed.py"
      - "btc-monitor/metric_quality.py"
      - "btc-monitor/quality_acceptance.py"
      - "btc-monitor/automation_prompt_v2.md"
      - "btc-monitor/policy_test_scenarios.md"
      - "btc-monitor/tests/**"
      - ".github/workflows/btc-monitor-bridge.yml"
  workflow_run:
    workflows:
      - "BTC spot CVD"
      - "BTC derivatives history"
      - "BTC options volatility and 25delta skew"
      - "BTC onchain consolidated feed"
      - "BTC order book depth and historical liquidity"
      - "BTC validated historical L2 books"
      - "BTC independent Bybit L2 historical depth"
      - "BTC spot OHLCV and verified trend technicals"
      - "BTC free macro rates and US spot ETF flows"
    types: [completed]
    branches: [main]
  schedule:
    - cron: "30 * * * *"
permissions:
  contents: write
concurrency:
  group: btc-monitor-bridge
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify data quality and stale/missing indicator unit tests
        run: |
          python -m py_compile btc-monitor/build_feed.py btc-monitor/metric_quality.py btc-monitor/quality_acceptance.py
          python -m unittest discover -s btc-monitor/tests -p "test_*.py" -v
      - name: Publish validated source bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python -u btc-monitor/build_feed.py
            # Verify the FULL and BRIEF outputs agree before they can reach
            # the scheduled ChatGPT risk monitor.
            python -u btc-monitor/quality_acceptance.py
            python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          status={
            "tested_commit":os.environ.get("GITHUB_SHA"),
            "test_completed_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "bridge_quality_tests_ok":True,
            "automation_policy_contract_tests_ok":True,
            "scope":"CI unit and structural prompt checks only; not proof of notifications or platform delivery",
            "source_policy":"btc-monitor/automation_prompt_v2.md",
            "source_cases":"btc-monitor/policy_test_scenarios.md",
          }
          path=Path("btc-monitor/data/policy_test_status.json")
          path.write_text(json.dumps(status,ensure_ascii=False,indent=2)+"\n")
          PY
            git add btc-monitor/data/latest.json btc-monitor/data/brief.json btc-monitor/data/policy_test_status.json btc-monitor/data/metric_quality_acceptance.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: BTC risk monitor source freshness and metric snapshot"
            if git push origin HEAD:main; then exit 0; fi
            echo "Competing collector push; retry from latest source data"
            sleep 3
          done
          exit 1
