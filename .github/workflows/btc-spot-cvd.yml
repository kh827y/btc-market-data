name: BTC spot CVD
on:
  push:
    paths:
      - "btc-spot-cvd/collector.py"
      - "btc-spot-cvd/tests/**"
      - ".github/workflows/btc-spot-cvd.yml"
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  # Additional triggers when scheduled executions are late.
  # NEVER trigger on monitor bridge; bridge already triggers on BTC spot CVD.
  workflow_run:
    workflows:
      - "BTC derivatives history"
      - "BTC options volatility and 25delta skew"
      - "BTC validated historical L2 books"
      - "BTC independent Bybit L2 historical depth"
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: btc-spot-cvd-collector-repaired-v2
  # Changes to collector code supersede obsolete long-running runs.
  # Scheduled/trailing worker runs themselves do not cancel one another.
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  collect:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r btc-spot-cvd/requirements.txt
      - name: Unit tests
        run: cd btc-spot-cvd && python -m unittest discover -s tests -v
      - name: Collect and commit from the current upstream checkpoint with retries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Free trade APIs must not be called four times merely because
          # unrelated GitHub workflows push a commit during collection.
          # Rebase a validated snapshot ONLY over changes to unrelated paths.
          # A truly changed CVD checkpoint requires a fresh calculation.
          for collection_attempt in 1 2; do
            git fetch origin main
            git reset --hard origin/main
            echo "CVD source collection $collection_attempt from latest checkpoint"
            python -u btc-spot-cvd/collector.py
            git add btc-spot-cvd/data/state.json btc-spot-cvd/data/latest.json
            if git diff --cached --quiet; then
              echo "Current CVD state unchanged"
              exit 0
            fi
            git commit -m "data: update verified BTC spot CVD checkpoint"
            source_collision=0
            for safe_push in 1 2 3 4 5 6; do
              if git push origin HEAD:main; then
                echo "Saved verified BTC CVD"
                exit 0
              fi
              git fetch origin main
              if ! git diff --quiet HEAD^ origin/main -- \
                    btc-spot-cvd/data/state.json \
                    btc-spot-cvd/data/latest.json \
                    btc-spot-cvd/collector.py \
                    btc-spot-cvd/coinbase_recent_repair.py \
                    btc-spot-cvd/coinbase_parallel_backfill.py; then
                source_collision=1
                echo "Actual CVD state or code advanced; recalculate once"
                break
              fi
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Cannot safely rebase BTC CVD; no blind overwrite" >&2
                exit 1
              fi
              echo "Rebased validated CVD on unrelated commit; retry push $safe_push"
            done
            if [ "$source_collision" -eq 0 ]; then
              echo "CVD publication raced too many times; source calls not repeated" >&2
              exit 1
            fi
          done
          echo "CVD source changed twice during collection; defer to next automatic run" >&2
          exit 1
