name: BTC spot CVD
on:
  push:
    paths:
      - "btc-spot-cvd/collector.py"
      - "btc-spot-cvd/tests/**"
      - ".github/workflows/btc-spot-cvd.yml"
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  # Additional triggers when scheduled executions are late.
  # NEVER trigger on monitor bridge; bridge already triggers on BTC spot CVD.
  workflow_run:
    workflows:
      - "BTC derivatives history"
      - "BTC options volatility and 25delta skew"
      - "BTC validated historical L2 books"
      - "BTC independent Bybit L2 historical depth"
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: btc-spot-cvd-collector-repaired-v2
  # Changes to collector code supersede obsolete long-running runs.
  # Scheduled/trailing worker runs themselves do not cancel one another.
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  collect:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r btc-spot-cvd/requirements.txt
      - name: Unit tests
        run: cd btc-spot-cvd && python -m unittest discover -s tests -v
      - name: Collect and commit from the current upstream checkpoint with retries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            echo "CVD write attempt $attempt: fetch latest canonical checkpoint"
            git fetch origin main
            git reset --hard origin/main
            python -u btc-spot-cvd/collector.py
            git add btc-spot-cvd/data/state.json btc-spot-cvd/data/latest.json
            if git diff --cached --quiet; then
              echo "No changes to save"
              exit 0
            fi
            git commit -m "data: update verified BTC spot CVD checkpoint"
            if git push origin HEAD:main; then
              echo "Saved CVD checkpoint"
              exit 0
            fi
            echo "Concurrent write conflict; recalculate from newest checkpoint"
            sleep 3
          done
          echo "CVD checkpoint could not be committed after retries" >&2
          exit 1
