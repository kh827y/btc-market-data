name: BTC onchain consolidated feed
on:
  push:
    paths:
      - "btc-onchain/consolidate.py"
      - "btc-onchain/tests/test_consolidate.py"
      - ".github/workflows/btc-onchain-consolidate.yml"
  workflow_dispatch:
  schedule:
    - cron: "55 6 * * *"
permissions:
  contents: write
concurrency:
  group: btc-onchain-consolidate
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate required and optional onchain data classification
        run: |
          python -m py_compile btc-onchain/consolidate.py
          python -m unittest discover -s btc-onchain/tests -p test_consolidate.py -v
      - run: python btc-onchain/consolidate.py
      - name: Save feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc-onchain/data/monitor_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update BTC onchain consolidated feed"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
