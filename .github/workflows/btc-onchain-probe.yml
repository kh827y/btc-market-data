name: BTC onchain API probe
on:
  push:
    paths:
      - "btc-onchain/probe.py"
      - ".github/workflows/btc-onchain-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python btc-onchain/probe.py
