name: BTC independent Bybit L2 historical depth
on:
  push:
    paths:
      - "btc-liquidity/bybit_independent.py"
      - "btc-liquidity/tests/test_bybit_independent.py"
      - ".github/workflows/btc-bybit-independent.yml"
  workflow_dispatch:
  schedule:
    - cron: "26 * * * *"
permissions:
  contents: write
concurrency:
  group: btc-bybit-independent
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test independent Bybit partial ZIP snapshot parsing
        run: |
          python -m py_compile btc-liquidity/bybit_independent.py
          python -m unittest discover -s btc-liquidity/tests -p test_bybit_independent.py -v
      - name: Collect and persist independent Bybit depth with write-race retries
        env:
          BYBIT_ARCHIVE_MAX_FILES: "120"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -u btc-liquidity/bybit_independent.py
            git add btc-liquidity/data/bybit_independent_latest.json btc-liquidity/data/bybit_independent_history.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: independently verified Bybit spot/perpetual orderbook history"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent update; refreshing canonical historical state" >&2
            sleep 3
          done
          exit 1
