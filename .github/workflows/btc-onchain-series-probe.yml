name: BTC exact LTH research probe
on:
  push:
    paths: ["btc-onchain/series_probe.py", ".github/workflows/btc-onchain-series-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python btc-onchain/series_probe.py
