name: BTC order book depth and historical liquidity
on:
  push:
    paths:
      - "btc-liquidity/collector.py"
      - "btc-liquidity/tests/**"
      - ".github/workflows/btc-liquidity.yml"
  workflow_dispatch:
  schedule:
    - cron: "19 * * * *"
permissions:
  contents: write
concurrency:
  group: btc-liquidity-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test orderbook accuracy and archive corruption detection
        run: |
          python -m py_compile btc-liquidity/collector.py
          cd btc-liquidity && python -m unittest discover -s tests -p test_collector.py -v
      - name: Collect and persist with race-safe latest-state retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            # Never rebase a generated time-series over concurrently changed JSON:
            # restart from the canonical latest main and derive forward from it.
            git fetch origin main
            git reset --hard origin/main
            python btc-liquidity/collector.py
            git add btc-liquidity/data/latest.json btc-liquidity/data/history.json
            if git diff --cached --quiet; then
              echo "Data unchanged"
              exit 0
            fi
            git commit -m "data: BTC orderbook liquidity and validated history"
            if git push origin HEAD:main; then
              echo "Persisted independent BTC liquidity time-series"
              exit 0
            fi
            echo "Concurrent repository update; refresh and retry ($attempt)"
            sleep 3
          done
          echo "Exhausted retry attempts" >&2
          exit 1
