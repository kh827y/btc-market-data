name: BTC order book depth and historical liquidity
on:
  push:
    paths:
      - "btc-liquidity/collector.py"
      - "btc-liquidity/official_ws.py"
      - "btc-liquidity/tests/**"
      - ".github/workflows/btc-liquidity.yml"
  workflow_dispatch:
  schedule:
    - cron: "19 * * * *"
permissions:
  contents: write
concurrency:
  group: btc-liquidity-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official public WebSocket transport client
        run: pip install websocket-client
      - name: Test orderbook accuracy and archive corruption detection
        run: |
          python -m py_compile btc-liquidity/collector.py btc-liquidity/official_ws.py
          cd btc-liquidity && python -m unittest discover -s tests -p test_collector.py -v
          python -m unittest discover -s tests -p test_official_ws.py -v
      - name: Collect and persist with race-safe latest-state retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            # Start from the canonical source and recompute a real fresh book.
            # If a concurrent writer changed our own data/code, repeat from
            # that source. Unrelated pushes may be safely rebased after proof
            # they did NOT touch the generated series or its collectors.
            git fetch origin main
            git reset --hard origin/main
            python btc-liquidity/collector.py
            git add btc-liquidity/data/latest.json btc-liquidity/data/history.json
            if git diff --cached --quiet; then
              echo "Data unchanged"
              exit 0
            fi
            git commit -m "data: BTC orderbook liquidity and validated history"
            if git push origin HEAD:main; then
              echo "Persisted independent BTC liquidity time-series"
              exit 0
            fi
            echo "Concurrent repository update; examine safe fast-forward ($attempt)"
            for safe_retry in 1 2 3; do
              git fetch origin main
              # HEAD^ is the exact canonical snapshot used to build this
              # commit. Rebase is permitted only if none of these source/data
              # paths changed upstream. Otherwise recalculate from main.
              if ! git diff --quiet HEAD^ origin/main -- \
                   btc-liquidity/data/latest.json \
                   btc-liquidity/data/history.json \
                   btc-liquidity/collector.py \
                   btc-liquidity/official_ws.py; then
                echo "Liquidity source or history advanced upstream; must recollect"
                break
              fi
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Safe rebase failed; must recollect"
                break
              fi
              if git push origin HEAD:main; then
                echo "Persisted real Binance and other native books after safe unrelated-commit rebase"
                exit 0
              fi
              echo "Another unrelated writer raced; safe retry ($safe_retry)"
            done
            sleep 2
          done
          echo "Exhausted retry attempts" >&2
          exit 1
