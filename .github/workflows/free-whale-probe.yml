name: Verify public whale history sources
on:
  push:
    paths: ["btc-onchain/free_whale_sources_probe.py", ".github/workflows/free-whale-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python btc-onchain/free_whale_sources_probe.py
