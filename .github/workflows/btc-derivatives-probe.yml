name: BTC derivatives source verification
on:
  push:
    paths:
      - "btc-derivatives/probe.py"
      - ".github/workflows/btc-derivatives-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python btc-derivatives/probe.py
