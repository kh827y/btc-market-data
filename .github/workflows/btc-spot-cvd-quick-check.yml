name: BTC Spot CVD and bridge quick verification
on:
  push:
    paths:
      - "btc-spot-cvd/collector.py"
      - "btc-spot-cvd/coinbase_recent_repair.py"
      - "btc-spot-cvd/tests/**"
      - "btc-monitor/build_feed.py"
      - "btc-monitor/tests/**"
      - ".github/workflows/btc-spot-cvd-quick-check.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-spot-cvd-unit-check
  cancel-in-progress: true
jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: pip install -r btc-spot-cvd/requirements.txt
      - name: Execute tests and commit independently reviewable result
        shell: bash
        run: |
          set +e
          (cd btc-spot-cvd && python -m unittest discover -s tests -v) > /tmp/cvd-check.log 2>&1
          cvd_status=$?
          python -m unittest discover -s btc-monitor/tests -p test_bridge.py -v > /tmp/bridge-check.log 2>&1
          bridge_status=$?
          # Real free-source smoke test: actual Bitget spot tick archive,
          # separate from offline unit tests and from the 30-day backfill.
          python - <<'PY' > /tmp/bitget-smoke.log 2>&1
          import datetime as dt
          import json
          import sys
          sys.path.insert(0,"btc-spot-cvd")
          from collector import BASE,UTC,symbol,get,calculate_parquet
          sym=symbol("bitget_spot",["BTCUSDT"])
          hour=dt.datetime(2026,11,1,12,tzinfo=UTC)
          path=f"bitget_spot/{hour:%Y-%m-%d}/{hour:%H}/{sym}_trades.parquet"
          row=calculate_parquet(get(BASE+"/download",params={"file":path}).content,hour)
          assert row["trades"]>0 and row["complete"] is True
          print(json.dumps({"exchange":"bitget_spot","symbol":sym,"hour":hour.isoformat(),
                            "trades":row["trades"],"net_usd_approx":row["net"]}))
          PY
          bitget_status=$?
          set -e
          tail -30 /tmp/cvd-check.log
          tail -30 /tmp/bridge-check.log
          tail -15 /tmp/bitget-smoke.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A verification workflow must NEVER overwrite canonical live
          # state/latest with a 12-page partial Coinbase smoke result.
          # Real source collection takes place only in the CVD collector job.
          cp -a btc-spot-cvd /tmp/btc-cvd-smoke
          mkdir -p /tmp/btc-cvd-smoke-work/btc-spot-cvd
          cp -a btc-spot-cvd/. /tmp/btc-cvd-smoke-work/btc-spot-cvd/
          set +e
          (cd /tmp/btc-cvd-smoke-work &&
            BTC_CVD_ARCHIVE_BATCH=2 BTC_CVD_COINBASE_RECENT_PAGES=0 BTC_CVD_COINBASE_DEEP_PAGES=0
            python -u btc-spot-cvd/collector.py) > /tmp/cvd-live.log 2>&1
          collect_status=$?
          (cd /tmp/btc-cvd-smoke-work && python -u btc-spot-cvd/probe_free_archive.py) > /tmp/cvd-probe.log 2>&1
          probe_status=$?
          set -e
          tail -18 /tmp/cvd-live.log
          tail -6 /tmp/cvd-probe.log
          BTC_CVD_TEST_STATUS="$cvd_status" BTC_BRIDGE_TEST_STATUS="$bridge_status" BTC_BITGET_SMOKE_STATUS="$bitget_status" BTC_COLLECT_STATUS="$collect_status" BTC_PROBE_STATUS="$probe_status" python - <<'PY' > /tmp/cvd-quick-check.json
          import datetime
          import json
          import os
          row = {
             "tested_commit_sha":os.getenv("GITHUB_SHA"),
             "completed_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
             "collector_tests_ok":os.getenv("BTC_CVD_TEST_STATUS") == "0",
             "bridge_tests_ok":os.getenv("BTC_BRIDGE_TEST_STATUS") == "0",
             "bitget_actual_hour_smoke_ok":os.getenv("BTC_BITGET_SMOKE_STATUS") == "0",
             "short_actual_collector_ok":os.getenv("BTC_COLLECT_STATUS") == "0",
             "historical_sample_probe_ok":os.getenv("BTC_PROBE_STATUS") == "0",
             "short_actual_collector_scope":"isolated temp-directory non-Coinbase sample, NOT authoritative current BTC CVD",
             "canonical_cvd_data_modified":False,
             "scope":"CI unit and limited source checks only; full original-five window checked exclusively in production",
          }
          print(json.dumps(row, indent=2))
          PY
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/cvd-quick-check.json btc-spot-cvd/data/quick_check.json
            git add btc-spot-cvd/data/quick_check.json
            if git diff --cached --quiet; then break; fi
            git commit -m "test: BTC CVD isolated unit and integration result"
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep 2
          done
          if [ "$cvd_status" -ne 0 ] || [ "$bridge_status" -ne 0 ] || [ "$bitget_status" -ne 0 ] || [ "$collect_status" -ne 0 ]; then exit 1; fi
