name: BTC Spot CVD and bridge quick verification
on:
  push:
    paths:
      - "btc-spot-cvd/collector.py"
      - "btc-spot-cvd/tests/**"
      - "btc-monitor/build_feed.py"
      - "btc-monitor/tests/**"
      - ".github/workflows/btc-spot-cvd-quick-check.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-spot-cvd-unit-check
  cancel-in-progress: true
jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: pip install -r btc-spot-cvd/requirements.txt
      - name: Execute tests and commit independently reviewable result
        shell: bash
        run: |
          set +e
          (cd btc-spot-cvd && python -m unittest discover -s tests -v) > /tmp/cvd-check.log 2>&1
          cvd_status=$?
          python -m unittest discover -s btc-monitor/tests -p test_bridge.py -v > /tmp/bridge-check.log 2>&1
          bridge_status=$?
          # Real free-source smoke test: actual Bitget spot tick archive,
          # separate from offline unit tests and from the 30-day backfill.
          python - <<'PY' > /tmp/bitget-smoke.log 2>&1
          import datetime as dt
          import json
          import sys
          sys.path.insert(0,"btc-spot-cvd")
          from collector import BASE,UTC,symbol,get,calculate_parquet
          sym=symbol("bitget_spot",["BTCUSDT"])
          hour=dt.datetime(2026,11,1,12,tzinfo=UTC)
          path=f"bitget_spot/{hour:%Y-%m-%d}/{hour:%H}/{sym}_trades.parquet"
          row=calculate_parquet(get(BASE+"/download",params={"file":path}).content,hour)
          assert row["trades"]>0 and row["complete"] is True
          print(json.dumps({"exchange":"bitget_spot","symbol":sym,"hour":hour.isoformat(),
                            "trades":row["trades"],"net_usd_approx":row["net"]}))
          PY
          bitget_status=$?
          set -e
          tail -30 /tmp/cvd-check.log
          tail -30 /tmp/bridge-check.log
          tail -15 /tmp/bitget-smoke.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            # Short REAL collection, not just mocks: save compact verified
            # spot trades and progress even if Coinbase deep history is incomplete.
            BTC_CVD_ARCHIVE_BATCH=3 BTC_CVD_COINBASE_RECENT_PAGES=12 BTC_CVD_COINBASE_DEEP_PAGES=12 python -u btc-spot-cvd/collector.py > /tmp/cvd-live.log 2>&1
            collect_status=$?
            tail -25 /tmp/cvd-live.log
            python -u btc-spot-cvd/probe_free_archive.py > /tmp/cvd-probe.log 2>&1
            probe_status=$?
            tail -6 /tmp/cvd-probe.log
            BTC_CVD_TEST_STATUS="$cvd_status" BTC_BRIDGE_TEST_STATUS="$bridge_status" BTC_BITGET_SMOKE_STATUS="$bitget_status" BTC_COLLECT_STATUS="$collect_status" BTC_PROBE_STATUS="$probe_status" python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          row = {
             "tested_commit_sha":os.getenv("GITHUB_SHA"),
             "completed_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
             "collector_tests_ok":os.getenv("BTC_CVD_TEST_STATUS") == "0",
             "bridge_tests_ok":os.getenv("BTC_BRIDGE_TEST_STATUS") == "0",
             "bitget_actual_hour_smoke_ok":os.getenv("BTC_BITGET_SMOKE_STATUS") == "0",
             "short_actual_collector_ok":os.getenv("BTC_COLLECT_STATUS") == "0",
             "historical_sample_probe_ok":os.getenv("BTC_PROBE_STATUS") == "0",
             "short_actual_collector_scope":"3 new hours per non-Coinbase venue plus 24 Coinbase REST pages",
             "bitget_smoke_hour_utc":"2026-11-01T12:00:00Z",
             "scope":"unit tests only; does NOT prove successful new trade data download or full 24h/7d/30d CVD",
          }
          path=Path("btc-spot-cvd/data/quick_check.json")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(row,indent=2)+"\n")
          PY
            git add btc-spot-cvd/data/quick_check.json btc-spot-cvd/data/latest.json btc-spot-cvd/data/state.json btc-spot-cvd/data/archive_probe.json
            if git diff --cached --quiet; then break; fi
            git commit -m "test: BTC CVD and bridge unit check result"
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep 2
          done
          if [ "$cvd_status" -ne 0 ] || [ "$bridge_status" -ne 0 ] || [ "$bitget_status" -ne 0 ] || [ "$collect_status" -ne 0 ]; then exit 1; fi
