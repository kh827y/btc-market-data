name: BTC watchdog one-shot real recovery verification
on:
  push:
    paths:
      - "btc-monitor/watchdog_recovery_smoke.py"
      - ".github/workflows/btc-watchdog-recovery-test.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: btc-watchdog-recovery-integration-test
  cancel-in-progress: false
jobs:
  test-real-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Perform exactly one safe real GitHub workflow_dispatch and verify its run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python -u btc-monitor/watchdog_recovery_smoke.py
          git add btc-monitor/data/watchdog_recovery_test.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: verified real automatic BTC collector workflow dispatch"
          for n in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            sleep 2
          done
          exit 1
