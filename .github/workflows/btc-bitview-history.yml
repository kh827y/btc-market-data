name: BTC Bitview holder history
on:
  push:
    paths:
      - "btc-onchain/bitview_collector.py"
      - ".github/workflows/btc-bitview-history.yml"
  workflow_dispatch:
  schedule:
    - cron: "11 6 * * *"
permissions:
  contents: write
concurrency:
  group: btc-bitview-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and verify holder series
        run: python btc-onchain/bitview_collector.py
      - name: Save observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc-onchain/data/bitview_history.json btc-onchain/data/bitview_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh verified Bitview cohorts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
