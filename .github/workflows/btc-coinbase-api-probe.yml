name: BTC Coinbase public trades pagination probe
on:
  push:
    paths:
      - "btc-spot-cvd/coinbase_api_probe.py"
      - ".github/workflows/btc-coinbase-api-probe.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  read-only-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Verify real Coinbase Exchange trade cursor response
        run: python btc-spot-cvd/coinbase_api_probe.py
      - name: Publish observed page size and timestamps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort; exit 1; fi
            git add btc-spot-cvd/data/coinbase_api_probe.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "probe: Coinbase public BTC-USD trade REST page size and cursor" || true
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
