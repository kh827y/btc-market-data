name: BTC onchain history
on:
  push:
    paths:
      - "btc-onchain/collector.py"
      - "btc-onchain/tests/test_primary_selection.py"
      - ".github/workflows/btc-onchain-history.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * *"
permissions:
  contents: write
concurrency:
  group: btc-onchain-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify free daily request cap and LTH bootstrap
        run: |
          python -m unittest discover -s btc-onchain/tests -p test_primary_selection.py -v
      - name: Update and persist verified onchain history from newest checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python -u btc-onchain/collector.py
            git add btc-onchain/data/history.json btc-onchain/data/latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: update BTC onchain historical metrics"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent data updates; reload canonical checkpoint and retry"
            sleep 3
          done
          exit 1
