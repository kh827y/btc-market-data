name: BTC onchain history
on:
  push:
    paths:
      - "btc-onchain/collector.py"
      - "btc-onchain/tests/test_primary_selection.py"
      - ".github/workflows/btc-onchain-history.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * *"
  # Fallback if GitHub misses the early daily cron; no L2 dependency.
  workflow_run:
    workflows:
      - "BTC Bitview holder history"
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: btc-onchain-history
  cancel-in-progress: false
jobs:
  collect:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify free daily request budget and weekly reference cadence
        run: |
          python -m unittest discover -s btc-onchain/tests -p test_primary_selection.py -v
      - name: Update and persist verified onchain history from newest checkpoint
        # Code-push CI validates logic only; it must not repeatedly consume
        # the free API quota. Genuine data collection is daily/dispatch.
        if: ${{ github.event_name != 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Run public onchain API collection ONCE, not four times if an
          # unrelated collector happens to commit during this daily task.
          git fetch origin main
          git reset --hard origin/main
          # The free tier is 15 requests/day. A delayed schedule and the
          # Bitview fallback must never both spend the daily budget.
          if python - <<'PY'
          import datetime as dt, json, pathlib, sys
          path=pathlib.Path("btc-onchain/data/latest.json")
          try:
              prior=json.loads(path.read_text())
              date=dt.datetime.fromisoformat(prior["generated_utc"].replace("Z","+00:00")).date()
              # Exit 1 if already collected today (shell's ELSE branch exits 0).
              sys.exit(1 if date==dt.datetime.now(dt.timezone.utc).date() else 0)
          except (OSError,KeyError,ValueError,TypeError):
              sys.exit(0)
          PY
          then
            python -u btc-onchain/collector.py
          else
            echo "Verified onchain collection already completed today; preserve free quota"
            exit 0
          fi
          git add btc-onchain/data/history.json btc-onchain/data/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: update BTC onchain historical metrics"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Persisted single onchain collector snapshot"
              exit 0
            fi
            git fetch origin main
            # Rebase only if source history and collector code have not
            # advanced upstream. Otherwise DO NOT replay free API calls.
            if ! git diff --quiet HEAD^ origin/main -- \
                 btc-onchain/data/history.json \
                 btc-onchain/data/latest.json \
                 btc-onchain/collector.py; then
              echo "Onchain checkpoint advanced independently; avoid blind overwrite or repeated free requests" >&2
              exit 1
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Could not safely rebase collected onchain snapshot" >&2
              exit 1
            fi
          done
          echo "Exhausted safe publication retries; do not repeat API calls" >&2
          exit 1
