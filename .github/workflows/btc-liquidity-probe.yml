name: Probe free BTC L2 history sources
on:
  workflow_dispatch:
  push:
    paths:
      - "btc-liquidity/probe_hft.py"
      - ".github/workflows/btc-liquidity-probe.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Arrow parquet reader
        run: python -m pip install -q pyarrow
      - name: Check real unauthenticated L2 archive response and symbols
        run: python -u btc-liquidity/probe_hft.py
