name: BTC spot OHLCV and verified trend technicals
on:
  push:
    paths:
      - "btc-price/collector.py"
      - "btc-price/tests/**"
      - ".github/workflows/btc-price-technicals.yml"
  workflow_dispatch:
  # GitHub's scheduled events can be delayed; run a second independent
  # hourly attempt after derivatives finish, without changing the L2 jobs.
  workflow_run:
    workflows:
      - "BTC derivatives history"
    types: [completed]
    branches: [main]
  schedule:
    - cron: "6 * * * *"
permissions:
  contents: write
concurrency:
  group: btc-price-technicals
  cancel-in-progress: false
jobs:
  verify-and-collect:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regression checks of historical data and closed-candle calculations
        run: |
          python -m py_compile btc-price/collector.py
          python -m unittest discover -s btc-price/tests -v
      - name: Fetch real BTC spot klines and commit only fully validated results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python -u btc-price/collector.py
            git add btc-price/data/latest.json btc-price/data/history.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: verified BTC spot close, MA/RSI and 200-week trend"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent update, reload latest canonical data and retry" >&2
            sleep 3
          done
          exit 1
