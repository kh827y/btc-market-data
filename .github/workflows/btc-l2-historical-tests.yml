name: BTC L2 historical regression and archive coverage tests
on:
  push:
    paths:
      - "btc-liquidity/bybit_parallel_backfill.py"
      - "btc-liquidity/bybit_independent.py"
      - "btc-liquidity/hft_history.py"
      - "btc-liquidity/historical_integrity.py"
      - "btc-liquidity/tests/test_bybit_parallel.py"
      - "btc-liquidity/tests/test_bybit_independent.py"
      - "btc-liquidity/tests/test_hft_history.py"
      - ".github/workflows/btc-l2-historical-tests.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-l2-historical-regression
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyarrow zstandard
      - name: Unit tests (verified snapshots, shard completeness, source failures)
        shell: bash
        run: |
          set +e
          python -m unittest discover -s btc-liquidity/tests -p test_bybit_independent.py -v > /tmp/bybit-base.log 2>&1
          b=$?
          python -m unittest discover -s btc-liquidity/tests -p test_bybit_parallel.py -v > /tmp/bybit-shard.log 2>&1
          p=$?
          python -m unittest discover -s btc-liquidity/tests -p test_hft_history.py -v > /tmp/hft.log 2>&1
          h=$?
          set -e
          tail -25 /tmp/bybit-base.log
          tail -25 /tmp/bybit-shard.log
          tail -25 /tmp/hft.log
          echo "B=$b" >> "$GITHUB_ENV"
          echo "P=$p" >> "$GITHUB_ENV"
          echo "H=$h" >> "$GITHUB_ENV"
      - name: Validate current published archive coverage (not stale triggering checkout)
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          python -u btc-liquidity/historical_integrity.py
      - name: Re-test and publish provenance for exactly the source revision audited
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            # Source code and published source-date history MUST be from
            # the same current revision, not an older push checkout.
            python -m unittest discover -s btc-liquidity/tests -p test_bybit_independent.py -q
            python -m unittest discover -s btc-liquidity/tests -p test_bybit_parallel.py -q
            python -m unittest discover -s btc-liquidity/tests -p test_hft_history.py -q
            python -u btc-liquidity/historical_integrity.py
            export TESTED_COMMIT="$(git rev-parse HEAD)"
            python - <<'PY'
          import datetime, json, os, pathlib
          status={
            "tested_commit":os.environ["TESTED_COMMIT"],
            "test_completed_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "bybit_snapshot_tests_ok":True,
            "bybit_parallel_merge_tests_ok":True,
            "hft_history_tests_ok":True,
            "independent_historical_integrity_ok":True,
            "scope":"source parser/unit tests and matching published-source-date integrity; not full historical completeness or notification delivery proof"
          }
          path=pathlib.Path("btc-liquidity/data/historical_test_status.json")
          path.write_text(json.dumps(status,indent=2)+"\n")
          PY
            git add btc-liquidity/data/historical_test_status.json btc-liquidity/data/historical_integrity_status.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "test: verified BTC L2 historical archive integrity at matching revision"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent BTC collector push; re-test newest published history"
            sleep 3
          done
          exit 1
